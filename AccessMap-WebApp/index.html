<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessMap - Iniciar Sesión</title> 
    
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <main class="login-container">
        <form class="login-card">
            
            <img src="assets/img/AccessMap-Logo.png" alt="Logo AccessMap">
            
            <p class="accessmap-design">
                <span class="design-access texto-azul">Access</span>
                <span class="design-map texto-verde-azulado">Map</span>
            </p>

            <h2 class="login-subtitle">Iniciar Sesión</h2> 

            <p class="login-description-text">Ingresa tu correo y tu contraseña para iniciar sesión</p>
            
            <div class="input-group">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="ejemplo@upc.edu.pe" required>
            </div>
            
            <div class="input-group">
                <label for="login-pass">Contraseña</label>
                <input type="password" id="login-pass" placeholder="********" required>
            </div>
            
            <div class="remember-forgot-container">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Recordarme</label>
                </div>
                <a href="#" class="forgot-password texto-azul">¿Olvidaste tu contraseña?</a>
            </div>
            
            <div class="button-group">
                <button type="submit" id="btn-login-submit" class="btn-azul">Ingresar</button>
            </div>

            <div class="separator">
                <span class="line"></span>
                <span class="text">o inicia sesión con:</span> 
                <span class="line"></span>
            </div>
            
            <div class="social-login">
                <button type="button" class="btn-social btn-facebook">
                    <span class="social-icon social-facebook"></span>
                    Continuar con Facebook
                </button>
                <button type="button" class="btn-social btn-google">
                    <span class="social-icon social-google"></span>
                    Continuar con Google
                </button>
            </div>
            
            <div class="register-cta">
                <span>¿No tienes una cuenta? </span>
                <a href="#" class="register-link texto-azul">Regístrate</a>
            </div>
        </form>
    </main>

    <script src="scripts/main.js"></script>
    <script src="scripts/auth.js"></script>
</body>
</html>
